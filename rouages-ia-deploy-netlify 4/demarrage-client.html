<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démarrer votre projet — Rouages IA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1B1D1F; --ink-2:#26282B; --paper:#EDEAE1;
    --brass:#B8823D; --brass-hi:#D9A85C; --steel:#3E6E64;
    --line:rgba(237,234,225,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;}
  h1,h2{font-family:'Space Grotesk',sans-serif;}
  a{color:var(--brass-hi);}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 6vw;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-size:19px;font-weight:700;text-decoration:none;color:var(--paper);}
  main{max-width:680px;margin:0 auto;padding:70px 6vw 120px;}
  .eyebrow{font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--brass-hi);margin-bottom:16px;}
  h1{font-size:clamp(30px,4.5vw,44px);margin-bottom:14px;}
  main > p.intro{font-size:15px;line-height:1.65;color:rgba(237,234,225,0.65);margin-bottom:50px;max-width:520px;}

  form{display:flex;flex-direction:column;gap:26px;}
  fieldset{border:none;padding:0;}
  legend{
    font-family:'JetBrains Mono';font-size:12px;color:var(--brass-hi);text-transform:uppercase;
    letter-spacing:0.06em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line);width:100%;
  }
  .field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .field label{font-size:14px;color:rgba(237,234,225,0.75);}
  .field .hint{font-size:12px;color:rgba(237,234,225,0.4);}
  .field input, .field textarea, .field select{
    background:var(--ink-2);border:1px solid var(--line);border-radius:4px;
    padding:13px 14px;color:var(--paper);font-family:'Inter';font-size:14px;
    resize:vertical;transition:border-color .2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--brass);}
  .field input[type="file"]{padding:10px;cursor:pointer;}
  .radio-group{display:flex;gap:20px;flex-wrap:wrap;}
  .radio-group label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;cursor:pointer;}
  button[type="submit"]{
    background:var(--brass);color:var(--ink);font-weight:600;font-size:14px;padding:16px 32px;
    border:none;border-radius:2px;cursor:pointer;transition:.2s;align-self:flex-start;margin-top:10px;
  }
  button[type="submit"]:hover{background:var(--brass-hi);transform:translateY(-2px);}

  footer{border-top:1px solid var(--line);padding:40px 6vw;text-align:center;font-size:13px;color:rgba(237,234,225,0.4);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">
    <svg width="24" height="24" viewBox="0 0 64 64"><path fill="#B8823D" d="M 52.00 32.00 L 55.63 36.20 L 54.83 39.42 L 49.65 41.41 L 48.18 43.76 L 48.65 49.29 L 46.11 51.42 L 40.74 49.99 L 38.18 51.02 L 35.31 55.77 L 32.00 56.00 L 28.50 51.69 L 25.82 51.02 L 20.70 53.17 L 17.89 51.42 L 17.59 45.87 L 15.82 43.76 L 10.41 42.49 L 9.17 39.42 L 12.19 34.76 L 12.00 32.00 L 8.37 27.80 L 9.17 24.58 L 14.35 22.59 L 15.82 20.24 L 15.35 14.71 L 17.89 12.58 L 23.26 14.01 L 25.82 12.98 L 28.69 8.23 L 32.00 8.00 L 35.50 12.31 L 38.18 12.98 L 43.30 10.83 L 46.11 12.58 L 46.41 18.13 L 48.18 20.24 L 53.59 21.51 L 54.83 24.58 L 51.81 29.24 Z"/><circle cx="32" cy="32" r="9.5" fill="#1B1D1F"/></svg>
    Rouages IA
  </a>
</header>

<main>
  <div class="eyebrow">Bienvenue</div>
  <h1>Démarrons votre projet</h1>
  <p class="intro">Merci pour votre confiance. Ce court formulaire nous permet de récupérer tout ce dont on a besoin pour commencer à construire — comptez environ 5 minutes.</p>

  <form name="demarrage-client" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data">
    <input type="hidden" name="form-name" value="demarrage-client">
    <p style="display:none;"><label>Ne pas remplir : <input name="bot-field"></label></p>

    <fieldset>
      <legend>Votre entreprise</legend>
      <div class="field">
        <label for="entreprise">Nom de l'entreprise ou de l'organisme</label>
        <input id="entreprise" type="text" name="entreprise" required>
      </div>
      <div class="field">
        <label for="secteur">Secteur d'activité</label>
        <input id="secteur" type="text" name="secteur" placeholder="Ex: restauration, sport amateur, commerce de détail">
      </div>
      <div class="field">
        <label for="description">Décrivez votre entreprise en quelques phrases</label>
        <textarea id="description" name="description" rows="4"></textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Votre commande</legend>
      <div class="field">
        <label>Forfait acheté</label>
        <div class="radio-group">
          <label><input type="radio" name="forfait" value="Site" required> Site (1 500 $)</label>
          <label><input type="radio" name="forfait" value="Site + Automatisation" required> Site + Automatisation (3 200 $)</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contact</legend>
      <div class="field">
        <label for="nom">Votre nom</label>
        <input id="nom" type="text" name="nom" required>
      </div>
      <div class="field">
        <label for="courriel">Courriel</label>
        <input id="courriel" type="email" name="courriel" required>
      </div>
      <div class="field">
        <label for="telephone">Téléphone <span class="hint">(optionnel)</span></label>
        <input id="telephone" type="tel" name="telephone">
      </div>
    </fieldset>

    <fieldset>
      <legend>Matériel visuel</legend>
      <div class="field">
        <label for="logo">Votre logo <span class="hint">(si vous en avez un — sinon on peut vous en créer un)</span></label>
        <input id="logo" type="file" name="logo" accept="image/*">
      </div>
      <div class="field">
        <label for="couleurs">Couleurs préférées ou déjà utilisées</label>
        <input id="couleurs" type="text" name="couleurs" placeholder="Ex: bleu marine et or, ou aucune préférence">
      </div>
      <div class="field">
        <label for="inspiration">Des sites que vous aimez ? <span class="hint">(collez des liens, séparés par une virgule)</span></label>
        <textarea id="inspiration" name="inspiration" rows="2"></textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contenu</legend>
      <div class="field">
        <label for="pages">Quelles pages/sections voulez-vous sur votre site ?</label>
        <textarea id="pages" name="pages" rows="3" placeholder="Ex: Accueil, À propos, Services, Contact"></textarea>
      </div>
      <div class="field">
        <label for="textes">Avez-vous déjà des textes prêts, ou voulez-vous qu'on les rédige ?</label>
        <textarea id="textes" name="textes" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="delai">Délai souhaité</label>
        <input id="delai" type="text" name="delai" placeholder="Ex: dès que possible, ou une date précise">
      </div>
    </fieldset>

    <fieldset>
      <legend>Autre</legend>
      <div class="field">
        <label for="notes">Autre chose qu'on devrait savoir ?</label>
        <textarea id="notes" name="notes" rows="3"></textarea>
      </div>
    </fieldset>

    <button type="submit">Envoyer et démarrer mon projet</button>
  </form>
</main>

<footer>© 2026 Rouages IA</footer>

</body>
</html>
